name: Build It For Me

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Runner platform to build on"
        required: true
        type: choice
        options:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        default: ubuntu-latest

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  community-build:
    runs-on: ${{ inputs.platform }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install Linux Slint GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfontconfig1-dev \
            libfreetype6-dev \
            libx11-dev \
            libxcursor-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgl1-mesa-dev

      # Same as ci.yml: clear unused preinstalled aws/tap before brew runs.
      - name: Remove unused preinstalled Homebrew taps
        if: runner.os == 'macOS'
        run: |
          if brew tap 2>/dev/null | grep -Fxq aws/tap; then
            brew untap aws/tap
          fi

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: |
          cargo clippy --workspace --all-targets --all-features --exclude acquire-slint -- -D warnings
          cargo clippy -p acquire-slint --all-targets --features gui -- -D warnings

      - name: cargo test
        run: |
          cargo test --workspace --locked --exclude acquire-slint
          cargo test -p acquire-slint --features gui --locked

      - name: cargo build (Slint shell, release)
        run: cargo build -p acquire-slint --features gui --release --locked

      - name: Package community build
        shell: bash
        run: |
          mkdir -p community-build/bin
          BIN="target/release/trareon-acquire"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            BIN="target/release/trareon-acquire.exe"
          fi
          cp "$BIN" community-build/bin/
          {
            echo "Trareon Acquire — Community/Self Build (Slint, GPLv3)"
            echo ""
            echo "Source commit: ${{ github.sha }}"
            echo "Workflow repository: ${{ github.repository }}"
            echo "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "Build class: Community/Self Build"
            echo "Binary: bin/trareon-acquire"
            echo ""
            echo "Not validated for production evidence acquisition."
            echo "GPLv3: corresponding source is this repository at the commit above."
          } > community-build/COMMUNITY-SELF-BUILD.txt

      - name: Upload community build artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: trareon-acquire-community-build-${{ inputs.platform }}
          path: community-build
          retention-days: 7

      - name: Attest community build artifact
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-path: community-build/COMMUNITY-SELF-BUILD.txt
          predicate-type: "https://trareon.com/attestations/community-self-build/v1"
          predicate: |
            {
              "buildClass": "Community/Self Build",
              "sourceCommit": "${{ github.sha }}",
              "workflowRepository": "${{ github.repository }}",
              "validated": false,
              "notice": "Not validated for production evidence acquisition."
            }
