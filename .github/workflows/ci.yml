name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Install Linux Tauri build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libssl-dev \
            patchelf
      # GitHub-hosted macOS images preinstall third-party taps (e.g. aws/tap).
      # setup-rust-toolchain runs `brew install bash`, which then emits a Tap Trust
      # warning annotation. Untap only unused taps (azure/bicep stays — bicep is installed).
      - name: Remove unused preinstalled Homebrew taps
        if: runner.os == 'macOS'
        run: |
          if brew tap 2>/dev/null | grep -Fxq aws/tap; then
            brew untap aws/tap
          fi
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: cargo test
        run: cargo test --workspace --locked
      - name: bounded property/fuzz smoke
        run: cargo test -p trareon-core --test properties --locked
      - name: performance baseline smoke
        run: cargo test -p trareon-core --test performance --locked
      - name: npm ci
        run: npm ci --prefix apps/trareon-acquire
      - name: npm run build
        run: npm run build --prefix apps/trareon-acquire

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: cargo deny check (licenses, advisories, bans, sources)
        run: cargo deny check
      - name: npm audit (production dependencies only)
        run: npm audit --omit=dev --prefix apps/trareon-acquire
      - name: Scan for committed secret patterns
        run: |
          if grep -RInE '\-\-\-\-\-BEGIN (RSA |EC |OPENSSH |DSA |PGP )?PRIVATE KEY\-\-\-\-\-|AKIA[0-9A-Z]{16}|aws_secret_access_key\s*=' \
            --exclude-dir=target --exclude-dir=node_modules --exclude-dir=.git \
            --exclude-dir=dist --exclude-dir=gen .; then
            echo "Potential committed secret pattern found above."
            exit 1
          fi
      - name: Generate dependency manifest (provenance intent, not a full SBOM)
        run: cargo metadata --locked --format-version 1 > dependency-manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependency-manifest
          path: dependency-manifest.json
          retention-days: 30
