name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Install Linux Slint GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfontconfig1-dev \
            libfreetype6-dev \
            libx11-dev \
            libxcursor-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgl1-mesa-dev
      # GitHub-hosted macOS images preinstall third-party taps (e.g. aws/tap).
      # setup-rust-toolchain runs `brew install bash`, which then emits a Tap Trust
      # warning annotation. Untap only unused taps (azure/bicep stays — bicep is installed).
      - name: Remove unused preinstalled Homebrew taps
        if: runner.os == 'macOS'
        run: |
          if brew tap 2>/dev/null | grep -Fxq aws/tap; then
            brew untap aws/tap
          fi
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy (workspace except Slint GUI)
        run: cargo clippy --workspace --all-targets --all-features --exclude acquire-slint -- -D warnings
      - name: cargo clippy (acquire-slint)
        run: cargo clippy -p acquire-slint --all-targets --features gui -- -D warnings
      - name: cargo test (workspace except Slint GUI)
        run: cargo test --workspace --locked --exclude acquire-slint
      - name: acquire-slint UI model + foundation demo (no display required for lib tests)
        run: cargo test -p acquire-slint --no-default-features --tests --locked
      - name: acquire-slint GUI compile + tests
        run: cargo test -p acquire-slint --features gui --locked
      - name: bounded property/fuzz smoke
        run: cargo test -p trareon-core --test properties --locked
      - name: performance baseline smoke
        run: cargo test -p trareon-core --test performance --locked

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: cargo deny check (licenses, advisories, bans, sources)
        run: cargo deny check
      - name: Scan for committed secret patterns
        run: |
          if grep -RInE '\-\-\-\-\-BEGIN (RSA |EC |OPENSSH |DSA |PGP )?PRIVATE KEY\-\-\-\-\-|AKIA[0-9A-Z]{16}|aws_secret_access_key\s*=' \
            --exclude-dir=target --exclude-dir=node_modules --exclude-dir=.git \
            --exclude-dir=dist --exclude-dir=gen .; then
            echo "Potential committed secret pattern found above."
            exit 1
          fi
      - name: Generate dependency manifest (provenance intent, not a full SBOM)
        run: cargo metadata --locked --format-version 1 > dependency-manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependency-manifest
          path: dependency-manifest.json
          retention-days: 30
