[workspace]
members = ["crates/traeron-core", "crates/traeron-verifier"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MPL-2.0"
authors = ["Yusuf Shalahuddin Al Ayyubi As Sobari"]

[workspace.dependencies]
chrono = { version = "=0.4.45", features = ["serde"] }
hex = "=0.4.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.11.0"
tempfile = "=3.23.0"
thiserror = "=2.0.18"
uuid = { version = "=1.24.0", features = ["serde", "v4"] }
