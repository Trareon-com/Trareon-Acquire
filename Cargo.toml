[workspace]
members = [
  "crates/trareon-core",
  "crates/trareon-verifier",
  "crates/trareon-analysis",
  "crates/trareon-ata",
  "apps/acquire-slint",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"
authors = ["Yusuf Shalahuddin Al Ayyubi As Sobari"]

[workspace.dependencies]
chrono = { version = "=0.4.45", features = ["serde"] }
hex = "=0.4.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.11.0"
tempfile = "=3.23.0"
thiserror = "=2.0.18"
uuid = { version = "=1.24.0", features = ["serde", "v4"] }
flate2 = "=1.1.9"
crc32fast = "=1.5.0"
md-5 = "=0.10.6"
sha1 = "=0.10.6"
qrcode = "=0.14.1"
image = { version = "=0.25.6", default-features = false, features = ["png"] }
ed25519-dalek = { version = "=2.2.0", features = ["rand_core"] }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
zip = "=2.4.2"
