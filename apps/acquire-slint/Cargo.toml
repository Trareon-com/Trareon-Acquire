[package]
name = "acquire-slint"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Slint desktop shell for Trareon Acquire (GPLv3)"
build = "build.rs"

[[bin]]
name = "trareon-acquire"
path = "src/main.rs"
required-features = ["gui"]

[features]
default = ["gui", "ewf", "zff", "libewf-oracle"]
gui = ["dep:slint", "dep:slint-build", "dep:rfd"]
ewf = ["trareon-core/ewf"]
zff = ["trareon-core/zff"]
libewf-oracle = ["trareon-core/libewf-oracle"]

[dependencies]
trareon-core = { path = "../../crates/trareon-core", default-features = false }
trareon-ata = { path = "../../crates/trareon-ata" }
trareon-analysis = { path = "../../crates/trareon-analysis" }
trareon-verifier = { path = "../../crates/trareon-verifier" }
chrono.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
slint = { version = "1.9", optional = true }
rfd = { version = "0.15", optional = true }

[build-dependencies]
slint-build = { version = "1.9", optional = true }
