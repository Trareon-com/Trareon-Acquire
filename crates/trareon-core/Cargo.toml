[package]
name = "trareon-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["ewf"]
# Real EWF1/EWF2 writer via ewf-image (Path B). Keep UI label E01-lite until oracle green.
ewf = ["dep:ewf-image"]
# Optional: call libewf `ewfverify` when installed.
libewf-oracle = []
# Optional: ZFF via external `zffacquire` tool.
zff = []

[dependencies]
chrono.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid.workspace = true
flate2.workspace = true
crc32fast.workspace = true
md-5.workspace = true
sha1.workspace = true
qrcode.workspace = true
image.workspace = true
ed25519-dalek.workspace = true
rand_core.workspace = true
zip.workspace = true
ewf-image = { version = "0.2", optional = true }

[dev-dependencies]
tempfile.workspace = true
